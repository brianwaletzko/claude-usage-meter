# Builds the Windows desktop widget and attaches the installer and portable
# .exe to a GitHub Release.
#
# Release a new version:
#   1. bump "version" in desktop/package.json (e.g. 0.5.0) and push to main
#   2. git tag v0.5.0 && git push origin v0.5.0
# The tag must match package.json. If a release for the tag already exists
# (e.g. created with hand-written notes), the files are added to it;
# otherwise a release is created with auto-generated notes.
#
# Run it by hand (Actions tab → "Release desktop app" → Run workflow) to just
# build and test; the .exe files are then saved as a workflow artifact.

name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - name: Build installer and portable .exe
        run: npm run dist:win -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Claude Usage Meter $GITHUB_REF_NAME" --generate-notes --latest
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
