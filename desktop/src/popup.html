<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Claude Usage Meter</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1b1f;
    --muted: #61616b;
    --line: #e4e4e9;
    --track: #ececf1;
    --ok: #1f9d63;
    --warn: #c97a06;
    --high: #d6342c;
    --banner-bg: #fff5e0;
    --banner-fg: #6b4300;
    --btn: #f1f1f4;
    --btn-hover: #e6e6eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202024;
      --fg: #f1f1f3;
      --muted: #a3a3ad;
      --line: #34343b;
      --track: #34343b;
      --ok: #34c07f;
      --warn: #f0a32b;
      --high: #f2665e;
      --banner-bg: #3a2e14;
      --banner-fg: #f6d79a;
      --btn: #2d2d33;
      --btn-hover: #38383f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    border: 1px solid var(--line);
    user-select: none;
  }
  .wrap { padding: 0 16px 12px; }
  /* The header is the handle for dragging the window around. */
  header {
    display: flex; align-items: center; gap: 4px; margin: 0 -16px 10px; padding: 8px 8px 0 16px;
    -webkit-app-region: drag; cursor: move;
  }
  header button { -webkit-app-region: no-drag; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; }
  .win-btn { background: none; color: var(--muted); padding: 2px 7px; font-size: 14px; line-height: 1; }
  .win-btn:hover { color: var(--fg); }
  #close:hover { background: var(--high); color: #fff; }
  .updated { color: var(--muted); font-size: 12px; }
  button {
    font: inherit; color: var(--fg); background: var(--btn); border: 0; border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:focus-visible { outline: 2px solid var(--ok); outline-offset: 1px; }
  .icon-btn { padding: 4px 7px; line-height: 1; }
  .row { margin: 0 0 14px; }
  .row:last-child { margin-bottom: 0; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .label { font-weight: 600; }
  .pct { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pct small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 6px 0 5px; }
  .fill { height: 100%; border-radius: 4px; background: var(--ok); width: 0; transition: width .3s ease; }
  .warn .fill { background: var(--warn); }
  .high .fill { background: var(--high); }
  .warn .pct { color: var(--warn); }
  .high .pct { color: var(--high); }
  .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .extra .pct { font-size: 15px; }
  .extra .bar { height: 5px; }
  .banner {
    background: var(--banner-bg); color: var(--banner-fg); border-radius: 6px;
    padding: 8px 10px; margin-bottom: 12px; font-size: 12px;
  }
  .banner button { margin-top: 6px; }
  footer {
    border-top: 1px solid var(--line); padding: 8px 16px; display: flex;
    justify-content: space-between; align-items: center;
  }
  .link { background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .link:hover { background: none; color: var(--fg); }
  .empty { color: var(--muted); padding: 8px 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Claude usage</h1>
      <button class="icon-btn" id="refresh" title="Refresh now" aria-label="Refresh now">&#x21bb;</button>
      <button class="win-btn" id="menu" title="Settings" aria-label="Settings">&#x22ef;</button>
      <button class="win-btn" id="minimize" title="Minimize" aria-label="Minimize">&#x2013;</button>
      <button class="win-btn" id="close" title="Close" aria-label="Close">&#x2715;</button>
    </header>

    <div class="banner" id="banner" hidden>
      <div id="banner-text"></div>
      <button id="renew" hidden>Renew sign-in</button>
    </div>

    <div id="rows"><div class="empty">Checking your usage…</div></div>
  </div>
  <footer>
    <span class="updated" id="updated"></span>
    <button class="link" id="open">Usage page on claude.ai</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
